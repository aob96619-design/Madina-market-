<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madina Market Cloud - Marketplace & ERP Conakry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ice: { 50: '#f0f9ff', 500: '#0ea5e9', 900: '#0c4a6e' },
            madina: { gold: '#f59e0b', green: '#10b981', red: '#ef4444' }
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">
  <!-- Top Bar & Currency Selector -->
  <header class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-sky-500 flex items-center justify-center font-bold text-slate-950">MM</div>
      <div>
        <h1 class="font-bold text-sm tracking-wider text-sky-400">MADINA MARKET</h1>
        <p class="text-[10px] text-slate-400">Conakry Cloud ERP</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <select id="currencySelector" onchange="changeCurrency(this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2 py-1 text-sky-300">
        <option value="GNF">GNF (FG)</option>
        <option value="EUR">EUR (€)</option>
        <option value="USD">USD ($)</option>
      </select>
      <button onclick="switchTab('cart')" class="relative p-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-300">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Tab 1: Marketplace & Catalog -->
    <section id="tab-market" class="space-y-4">
      <div class="glass-panel p-3 rounded-xl flex items-center space-x-2">
        <i class="fa-solid fa-magnifying-glass text-slate-400 pl-2"></i>
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Rechercher un produit à Madina..." class="w-full bg-transparent text-sm text-slate-100 focus:outline-none">
      </div>
      <div id="productGrid" class="grid grid-cols-2 gap-3">
        <!-- Dynamic Products -->
      </div>
    </section>

    <!-- Tab 2: Vendor ERP & Camera Upload -->
    <section id="tab-erp" class="hidden space-y-4">
      <div class="glass-panel p-4 rounded-2xl space-y-3">
        <h2 class="font-bold text-sky-400 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up"></i> Espace Vendeur - Publier</h2>
        <p class="text-xs text-slate-400">Prenez une photo en direct ou choisissez depuis votre galerie pour mettre en ligne.</p>
        
        <form id="productForm" onsubmit="publishProduct(event)" class="space-y-3">
          <div>
            <label class="text-xs text-slate-300">Nom du produit</label>
            <input type="text" id="pName" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-slate-100" placeholder="Ex: Tissu Grand Boubou">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-300">Prix (en GNF)</label>
              <input type="number" id="pPrice" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-slate-100" placeholder="150000">
            </div>
            <div>
              <label class="text-xs text-slate-300">Stock initial</label>
              <input type="number" id="pStock" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-slate-100" placeholder="25">
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-300">Photo du produit (Appareil photo / Galerie)</label>
            <input type="file" id="pImageFile" accept="image/*" capture="environment" onchange="previewUpload(event)" class="w-full mt-1 text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-500 file:text-slate-950 hover:file:bg-sky-600">
          </div>
          <div id="uploadPreviewWrapper" class="hidden">
            <img id="uploadPreviewImg" class="w-full h-36 object-cover rounded-xl border border-sky-500/30">
          </div>
          <button type="submit" class="w-full py-3 bg-gradient-to-r from-sky-500 to-emerald-500 text-slate-950 font-bold rounded-xl shadow-lg">Publier sur Madina Cloud</button>
        </form>
      </div>

      <div class="glass-panel p-4 rounded-2xl space-y-3">
        <h3 class="font-bold text-sm text-slate-200">Inventaire en temps réel</h3>
        <div id="erpStockList" class="space-y-2 text-xs">
          <!-- Dynamic stock management -->
        </div>
      </div>
    </section>

    <!-- Tab 3: Cart & Checkout -->
    <section id="tab-cart" class="hidden space-y-4">
      <div class="glass-panel p-4 rounded-2xl space-y-3">
        <h2 class="font-bold text-sky-400"><i class="fa-solid fa-basket-shopping mr-2"></i>Votre Panier</h2>
        <div id="cartItemsList" class="space-y-2 text-sm divide-y divide-slate-800">
          <!-- Cart items -->
        </div>
        <div class="pt-2 border-t border-slate-800 space-y-2">
          <label class="text-xs text-slate-300">Commune de livraison (Conakry)</label>
          <select id="deliveryCommune" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-slate-100">
            <option value="Kaloum">Kaloum (20.000 GNF)</option>
            <option value="Dixinn">Dixinn (15.000 GNF)</option>
            <option value="Matam">Matam (15.000 GNF)</option>
            <option value="Ratoma">Ratoma (25.000 GNF)</option>
            <option value="Matoto">Matoto (30.000 GNF)</option>
          </select>
          <div class="flex justify-between font-bold text-base pt-2">
            <span>Total :</span>
            <span id="cartTotalPrice" class="text-amber-400">0 GNF</span>
          </div>
          <button onclick="openCheckoutModal()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl">Procéder au Paiement</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-800 flex justify-around p-3 z-50 max-w-md mx-auto">
    <button onclick="switchTab('market')" id="nav-market" class="text-sky-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-store text-lg"></i><span>Marché</span>
    </button>
    <button onclick="switchTab('erp')" id="nav-erp" class="text-slate-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-warehouse text-lg"></i><span>ERP Vendeur</span>
    </button>
    <button onclick="switchTab('cart')" id="nav-cart" class="text-slate-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-receipt text-lg"></i><span>Panier</span>
    </button>
  </nav>

  <!-- Checkout Simulation Modal -->
  <div id="checkoutModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-panel p-5 rounded-2xl w-full max-w-sm space-y-4 border border-sky-500/30">
      <h3 class="font-bold text-base text-sky-400">Validation de la Commande</h3>
      <p class="text-xs text-slate-300">Choisissez votre mode de paiement sécurisé :</p>
      <div class="space-y-2">
        <button onclick="simulatePayment('Orange Money')" class="w-full p-3 bg-orange-600/20 border border-orange-500/50 rounded-xl text-left text-xs font-semibold flex items-center justify-between">
          <span><i class="fa-solid fa-mobile-screen mr-2 text-orange-500"></i> Orange Money Guinée</span>
          <span class="text-orange-400">Instantané</span>
        </button>
        <button onclick="simulatePayment('MTN MoMo')" class="w-full p-3 bg-yellow-600/20 border border-yellow-500/50 rounded-xl text-left text-xs font-semibold flex items-center justify-between">
          <span><i class="fa-solid fa-mobile-screen mr-2 text-yellow-500"></i> MTN Mobile Money</span>
          <span class="text-yellow-400">Instantané</span>
        </button>
        <button onclick="simulatePayment('Carte Bancaire')" class="w-full p-3 bg-sky-600/20 border border-sky-500/50 rounded-xl text-left text-xs font-semibold flex items-center justify-between">
          <span><i class="fa-solid fa-credit-card mr-2 text-sky-500"></i> Carte Visa / Diaspora</span>
          <span class="text-sky-400">Sécurisé</span>
        </button>
      </div>
      <button onclick="closeCheckoutModal()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">Annuler</button>
    </div>
  </div>

  <script>
    let currentCurrency = 'GNF';
    let conversionRates = { GNF: 1, EUR: 0.00011, USD: 0.00012 };
    let cart = [];
    let uploadedImageBase64 = "https://images.unsplash.com/photo-1555529771-835f59fc5efe?auto=format&fit=crop&w=500&q=80";

    let products = [
      { id: 1, name: 'Bazin Riche Brodé - Conakry', price: 350000, stock: 12, image: 'https://images.unsplash.com/photo-1590695662136-173d5ee4655f?auto=format&fit=crop&w=500&q=80' },
      { id: 2, name: 'Café Robota Original de Guinée', price: 45000, stock: 50, image: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=500&q=80' },
      { id: 3, name: 'Savon Noir Artisanal de Madina', price: 25000, stock: 30, image: 'https://images.unsplash.com/photo-1608248597359-9943b179373e?auto=format&fit=crop&w=500&q=80' }
    ];

    function formatPrice(priceInGNF) {
      let val = priceInGNF * conversionRates[currentCurrency];
      if (currentCurrency === 'GNF') return Math.round(val).toLocaleString() + ' GNF';
      if (currentCurrency === 'EUR') return val.toFixed(2) + ' €';
      return val.toFixed(2) + ' $';
    }

    function changeCurrency(curr) {
      currentCurrency = curr;
      renderProducts();
      renderCart();
      renderERPStock();
    }

    function switchTab(tabId) {
      ['market', 'erp', 'cart'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
        document.getElementById('nav-' + t).classList.remove('text-sky-400');
        document.getElementById('nav-' + t).classList.add('text-slate-400');
      });
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('nav-' + tabId).classList.remove('text-slate-400');
      document.getElementById('nav-' + tabId).classList.add('text-sky-400');
    }

    function previewUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImageBase64 = e.target.result;
          document.getElementById('uploadPreviewImg').src = uploadedImageBase64;
          document.getElementById('uploadPreviewWrapper').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function publishProduct(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value;
      const price = parseFloat(document.getElementById('pPrice').value);
      const stock = parseInt(document.getElementById('pStock').value);

      const newProd = { id: Date.now(), name, price, stock, image: uploadedImageBase64 };
      products.unshift(newProd);

      document.getElementById('productForm').reset();
      document.getElementById('uploadPreviewWrapper').classList.add('hidden');
      renderProducts();
      renderERPStock();
      switchTab('market');
      alert('Produit publié avec succès sur Madina Market Cloud !');
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        glass-panel rounded-2xl p-3 flex flex-col justify-between space-y-2
        <div class="glass-panel rounded-xl p-2 flex flex-col justify-between space-y-2">
          <img src="${p.image}" class="w-full h-28 object-cover rounded-lg">
          <div>
            <h4 class="font-semibold text-xs text-slate-100 line-clamp-1">${p.name}</h4>
            <p class="text-xs font-bold text-amber-400 mt-1">${formatPrice(p.price)}</p>
            <p class="text-[10px] text-slate-400">Stock : ${p.stock}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="w-full py-1.5 bg-sky-500 hover:bg-sky-600 text-slate-950 text-xs font-bold rounded-lg">Ajouter</button>
        </div>
      `).join('');
    }

    function renderERPStock() {
      const list = document.getElementById('erpStockList');
      list.innerHTML = products.map(p => `
        <div class="flex justify-between items-center bg-slate-900 p-2 rounded-xl border border-slate-800">
          <span class="text-slate-200 truncate max-w-[120px]">${p.name}</span>
          <span class="text-amber-400 font-semibold">${p.stock} en stock</span>
          <span class="text-sky-400 font-bold">${formatPrice(p.price)}</span>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      if (prod && prod.stock > 0) {
        let cartItem = cart.find(item => item.id === id);
        if (cartItem) {
          cartItem.qty++;
        } else {
          cart.push({ ...prod, qty: 1 });
        }
        updateCartBadge();
        renderCart();
      } else {
        alert("Produit en rupture de stock.");
      }
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartBadge').innerText = totalCount;
    }

    function renderCart() {
      const list = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Votre panier est vide.</p>`;
        document.getElementById('cartTotalPrice').innerText = formatPrice(0);
        return;
      }
      list.innerHTML = cart.map(item => `
        <div class="py-2 flex justify-between items-center text-xs">
          <div>
            <p class="font-semibold text-slate-200">${item.name}</p>
            <p class="text-slate-400">${formatPrice(item.price)} x ${item.qty}</p>
          </div>
          <button onclick="removeFromCart(${item.id})" class="text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cartTotalPrice').innerText = formatPrice(subtotal);
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartBadge();
      renderCart();
    }

    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("Ajoutez d'abord des articles dans votre panier.");
        return;
      }
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    function simulatePayment(method) {
      alert(`Paiement de la commande validé avec succès via ${method} ! Livraison en cours vers Conakry.`);
      cart = [];
      updateCartBadge();
      renderCart();
      closeCheckoutModal();
      switchTab('market');
    }

    // Initial load
    renderProducts();
    renderERPStock();
  </script>
</body>
</html>
